<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADE</title>
    <link rel="stylesheet" href="vendor/xterm.css" />
    <link rel="stylesheet" href="vendor/cm/codemirror.css" />
    <link rel="stylesheet" href="vendor/cm/theme/monokai.css" />
    <link rel="stylesheet" href="vendor/cm/theme/material-darker.css" />
    <link rel="stylesheet" href="vendor/cm/addon/dialog.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-theme="dark" data-focus="terminal">
    <header class="menubar">
      <span class="app-mark" title="ADE" data-tauri-drag-region>◆</span>
      <nav class="menus" id="menus">
        <div class="menu" data-menu="file">
          <button class="menu-title">File</button>
          <div class="menu-pop">
            <button class="menu-item" data-action="new-window">New Window<kbd>Ctrl/Cmd N</kbd></button>
            <button class="menu-item" data-action="new-chat">New Chat</button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="save">Save File<kbd>Ctrl/Cmd S</kbd></button>
            <button class="menu-item" data-action="close-tab">Close Tab<kbd>Ctrl/Cmd W</kbd></button>
          </div>
        </div>
        <div class="menu" data-menu="edit">
          <button class="menu-title">Edit</button>
          <div class="menu-pop">
            <button class="menu-item" data-action="find">Find in File<kbd>Ctrl/Cmd F</kbd></button>
            <button class="menu-item" data-action="palette">Command Palette<kbd>Ctrl/Cmd ⇧ P</kbd></button>
          </div>
        </div>
        <div class="menu" data-menu="view">
          <button class="menu-title">View</button>
          <div class="menu-pop">
            <button class="menu-item" data-action="toggle-explorer">Toggle Explorer<kbd>Ctrl/Cmd B</kbd></button>
            <button class="menu-item" data-action="show-git">Source Control<kbd>Ctrl/Cmd G</kbd></button>
            <button class="menu-item" data-action="toggle-terminal">Toggle Big Terminal<kbd>Ctrl/Cmd `</kbd></button>
            <button class="menu-item" data-action="toggle-panel">Toggle Bottom Panel<kbd>Ctrl/Cmd J</kbd></button>
            <button class="menu-item" data-action="toggle-chat">Toggle Chat<kbd>Ctrl/Cmd ⇧ C</kbd></button>
            <button class="menu-item" data-action="focus-chat">Focus Chat<kbd>Ctrl/Cmd L</kbd></button>
            <button class="menu-item" data-action="show-preview">Preview</button>
            <div class="menu-sep"></div>
            <button class="menu-item" data-action="theme-dark">Theme: Dark+</button>
            <button class="menu-item" data-action="theme-light">Theme: Light</button>
            <button class="menu-item" data-action="theme-monokai">Theme: Monokai</button>
          </div>
        </div>
        <div class="menu" data-menu="terminal">
          <button class="menu-title">Terminal</button>
          <div class="menu-pop">
            <button class="menu-item" data-action="new-terminal">New Terminal<kbd>Ctrl/Cmd T</kbd></button>
            <button class="menu-item" data-action="show-terminal">Show Terminal</button>
          </div>
        </div>
        <div class="menu" data-menu="help">
          <button class="menu-title">Help</button>
          <div class="menu-pop">
            <button class="menu-item" data-action="shortcuts">Keyboard Shortcuts<kbd>Ctrl/Cmd /</kbd></button>
          </div>
        </div>
      </nav>

      <div class="mb-spacer" data-tauri-drag-region></div>

      <select id="model" class="mb-model" title="Active model"></select>
      <div id="status" class="status idle">ready</div>
      <div class="bell-wrap">
        <button id="bell" class="iconbtn" title="Activity (notifications)">
          <span class="bell-ico">◔</span>
          <span id="bell-badge" class="badge hidden">0</span>
        </button>
        <div id="notif" class="notif hidden">
          <div class="notif-head">
            <span>Activity</span>
            <button id="notif-clear" class="ghost mini">Clear</button>
          </div>
          <div id="notif-list" class="notif-list"></div>
        </div>
      </div>
      <button id="new-window" class="iconbtn" title="New window (Ctrl/Cmd+N)">⧉</button>
      <div class="win-controls">
        <button id="win-min" class="winbtn" title="Minimize">‒</button>
        <button id="win-max" class="winbtn" title="Maximize">▢</button>
        <button id="win-close" class="winbtn close" title="Close">✕</button>
      </div>
      <select id="theme" class="hidden">
        <option value="dark">Dark+</option>
        <option value="light">Light</option>
        <option value="monokai">Monokai</option>
      </select>
    </header>

    <div class="body">
      <!-- Explorer -->
      <aside class="sidebar">
        <div class="side-tabs">
          <button class="side-tab active" data-side="files">Explorer</button>
          <button class="side-tab" data-side="git">Source Control<span id="git-count" class="git-count hidden">0</span></button>
        </div>
        <div id="files-view" class="side-view">
          <div id="tree" class="tree"></div>
        </div>
        <div id="git-view" class="side-view hidden">
          <div class="git-head">
            <span id="git-branch" class="git-branch">—</span>
            <button id="git-refresh" class="iconbtn mini" title="Refresh">⟳</button>
          </div>
          <div class="git-commit">
            <textarea id="git-msg" rows="2" placeholder="Commit message (staged changes)"></textarea>
            <div class="git-commit-row">
              <button id="git-stage-all" class="ghost mini">Stage all</button>
              <button id="git-commit-btn" class="ghost mini primary">Commit</button>
            </div>
          </div>
          <div id="git-files" class="git-files"></div>
        </div>
      </aside>

      <div class="splitter v" data-target="sidebar"></div>

      <!-- Center: editor + bottom panel -->
      <section class="center">
        <section class="editor">
          <div id="editor-tabs" class="editor-tabs"></div>
          <div class="pane-head editor-head">
            <span id="editor-path">no file open</span>
            <button id="save" class="ghost" disabled>Save</button>
          </div>
          <div id="cm-host" class="cm-host">
            <div class="cm-empty">Select a file from the explorer.  (Ctrl/Cmd+S to save)</div>
          </div>
        </section>

        <div class="splitter h" data-target="panel"></div>

        <section class="panel">
          <div class="panel-tabs">
            <button class="ptab active" data-tab="terminal">Terminal</button>
            <button class="ptab" data-tab="preview">Preview</button>
            <div class="panel-actions">
              <span id="term-actions">
                <button id="term-new" class="ghost mini" title="New terminal">+</button>
              </span>
              <span id="preview-actions" class="hidden">
                <input id="preview-url" class="url" value="http://localhost:3000" />
                <button id="preview-go" class="ghost mini">Go</button>
                <button id="preview-reload" class="ghost mini" title="Reload">⟳</button>
              </span>
              <button id="panel-max" class="ghost mini" title="Maximize terminal (Ctrl/Cmd+`)">⤢</button>
            </div>
          </div>
          <div class="panel-body">
            <div id="terminal-view" class="tabview">
              <div id="term-tabs" class="term-tabs"></div>
              <div id="term-host" class="term-host"></div>
            </div>
            <div id="preview-view" class="tabview hidden">
              <iframe id="preview-frame" class="preview-frame" src="about:blank"></iframe>
            </div>
          </div>
        </section>
      </section>

      <div class="splitter v" data-target="chat"></div>

      <!-- Chat -->
      <section class="chat">
        <div class="pane-head">
          <span>Agent</span>
          <button id="clear-chat" class="ghost mini" title="New chat">New chat</button>
        </div>
        <div id="transcript" class="transcript">
          <div class="empty" id="empty">
            <div class="empty-logo">◆</div>
            <p>Bring your own key. Pick a model.<br />Ask the agent to read, edit, or run code.</p>
          </div>
        </div>
        <div class="composer">
          <textarea id="prompt" rows="1"
            placeholder="Ask the agent…  (Enter to send, Shift+Enter for newline)"></textarea>
          <button id="send">Send</button>
          <button id="stop" class="danger hidden">Stop</button>
        </div>
      </section>
    </div>

    <footer class="statusbar">
      <span id="sb-model" class="sb-item">—</span>
      <span id="sb-root" class="sb-item sb-root">—</span>
    </footer>

    <div id="shortcuts" class="palette hidden">
      <div class="palette-box sc-box">
        <div class="sc-head">Keyboard Shortcuts <span class="sc-esc">Esc</span></div>
        <div id="sc-list" class="sc-list"></div>
      </div>
    </div>

    <div id="diff-view" class="palette hidden">
      <div class="palette-box diff-box">
        <div class="diff-head">
          <span id="diff-path" class="diff-path">—</span>
          <span>
            <button id="diff-action" class="ghost mini"></button>
            <button id="diff-close" class="ghost mini">Close</button>
          </span>
        </div>
        <div id="diff-body" class="diff-body"></div>
      </div>
    </div>

    <div id="palette" class="palette hidden">
      <div class="palette-box">
        <input id="palette-input" placeholder="Type a command or file…  (Esc to close)" />
        <div id="palette-list" class="palette-list"></div>
      </div>
    </div>

    <script src="vendor/xterm.js"></script>
    <script src="vendor/xterm-addon-fit.js"></script>
    <script src="vendor/cm/codemirror.js"></script>
    <script src="vendor/cm/mode/xml.js"></script>
    <script src="vendor/cm/mode/javascript.js"></script>
    <script src="vendor/cm/mode/css.js"></script>
    <script src="vendor/cm/mode/htmlmixed.js"></script>
    <script src="vendor/cm/mode/clike.js"></script>
    <script src="vendor/cm/mode/rust.js"></script>
    <script src="vendor/cm/mode/python.js"></script>
    <script src="vendor/cm/mode/markdown.js"></script>
    <script src="vendor/cm/mode/shell.js"></script>
    <script src="vendor/cm/mode/toml.js"></script>
    <script src="vendor/cm/mode/yaml.js"></script>
    <script src="vendor/cm/addon/dialog.js"></script>
    <script src="vendor/cm/addon/searchcursor.js"></script>
    <script src="vendor/cm/addon/search.js"></script>
    <script src="app.js"></script>
  </body>
</html>
