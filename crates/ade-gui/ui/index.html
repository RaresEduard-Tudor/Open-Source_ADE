<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADE</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="logo">◆</span> ADE</div>
      <label class="model-picker">
        <span>model</span>
        <select id="model"></select>
      </label>
      <div id="status" class="status idle">ready</div>
    </header>

    <div class="body">
      <aside class="sidebar">
        <div class="pane-head">Explorer</div>
        <div id="tree" class="tree"></div>
      </aside>

      <div class="splitter" data-target="sidebar"></div>

      <section class="editor">
        <div class="pane-head editor-head">
          <span id="editor-path">no file open</span>
          <button id="save" class="ghost" disabled>Save</button>
        </div>
        <textarea id="code" class="code" spellcheck="false"
          placeholder="Select a file from the explorer to view or edit it.   (Ctrl/Cmd+S to save)"></textarea>
      </section>

      <div class="splitter" data-target="chat"></div>

      <section class="chat">
        <div id="transcript" class="transcript">
          <div class="empty" id="empty">
            <div class="empty-logo">◆</div>
            <p>Bring your own key. Pick a model.<br />Ask the agent to read, edit, or run code.</p>
          </div>
        </div>
        <div class="composer">
          <textarea
            id="prompt"
            rows="1"
            placeholder="Ask the agent…  (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <button id="send">Send</button>
        </div>
      </section>
    </div>

    <footer class="statusbar">
      <span id="sb-model" class="sb-item">—</span>
      <span id="sb-root" class="sb-item sb-root">—</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
