[workspace]
resolver = "2"
members = ["crates/ade-core", "crates/ade-cli", "crates/ade-gui"]
# GUI is excluded from the default build because it needs system webkit2gtk
# dev libraries. `cargo build` stays green on a fresh box; build the GUI
# explicitly with `cargo build -p ade-gui` once those libs are installed.
default-members = ["crates/ade-core", "crates/ade-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rares/open-source-ade"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"
dirs = "5"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", default-features = false }

# Release profile tuned for a tiny binary (<10MB target).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
